<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地演示页</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f4f6fa;
    color: #1f2933;
  }
  .card {
    width: min(520px, calc(100% - 32px));
    padding: 32px 28px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(31, 41, 51, .10);
    text-align: center;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 24px;
    letter-spacing: .5px;
  }
  .hint {
    margin: 0 0 24px;
    font-size: 13px;
    color: #7b8794;
  }
  #message {
    margin: 0 0 24px;
    padding: 16px;
    border-radius: 10px;
    background: #eef4ff;
    border: 1px solid #d6e4ff;
    font-size: 17px;
    line-height: 1.6;
    color: #1b4f9c;
    transition: background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  #message.is-changed {
    background: #e9f9ef;
    border-color: #c7ecd6;
    color: #1a7a45;
  }
  button {
    padding: 11px 24px;
    font-size: 15px;
    font-family: inherit;
    color: #fff;
    background: #2563eb;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color .2s ease, transform .05s ease;
  }
  button:hover { background: #1d4ed8; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
</style>
</head>
<body>
  <main class="card">
    <h1>本地演示页</h1>
    <p class="hint">纯 HTML + CSS + JavaScript，无任何外部依赖</p>
    <p id="message" role="status" aria-live="polite">这是初始消息：点击下方按钮可以改变它。</p>
    <button id="changeBtn" type="button">改变消息</button>
  </main>

<script>
  (function () {
    var messageEl = document.getElementById('message');
    var buttonEl = document.getElementById('changeBtn');
    var changed = false;

    buttonEl.addEventListener('click', function () {
      changed = !changed;
      if (changed) {
        messageEl.textContent = '消息已改变！再次点击按钮即可恢复。';
        messageEl.classList.add('is-changed');
        buttonEl.textContent = '恢复原消息';
      } else {
        messageEl.textContent = '这是初始消息：点击下方按钮可以改变它。';
        messageEl.classList.remove('is-changed');
        buttonEl.textContent = '改变消息';
      }
    });
  })();
</script>
</body>
</html>
